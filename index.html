<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>stock-selector</title>
  </head>
  <body>
      <div id="root">
        <div style="display:flex;align-items:center;justify-content:center;min-height:100vh;background:var(--ground,#0f1115);color:var(--text-primary,#e8eaed);font-family:system-ui,sans-serif;padding:20px;text-align:center;">
          <div style="max-width:400px;">
            <div style="width:48px;height:48px;border:4px solid var(--border-default,#2a2e38);border-top-color:var(--accent-brand,#ff7043);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 24px;"></div>
            <h2 style="margin:0 0 12px;font-size:18px;font-weight:600;">Loading Quant Vision…</h2>
            <p style="margin:0;color:var(--text-secondary,#9ca3af);font-size:14px;">Initializing app…</p>
            <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
          </div>
        </div>
      </div>
      <noscript>
        <div style="display:flex;align-items:center;justify-content:center;min-height:100vh;background:#0f1115;color:#e8eaed;font-family:system-ui,sans-serif;padding:20px;text-align:center;">
          <div style="max-width:400px;">
            <h2 style="color:#ef5350;margin-bottom:12px;">JavaScript Required</h2>
            <p>This application requires JavaScript to run. Please enable JavaScript in your browser settings.</p>
          </div>
        </div>
      </noscript>
      <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
