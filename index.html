<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>stock-selector</title>
  </head>
  <body>
      <div id="root">
        <div style="display:flex;align-items:center;justify-content:center;min-height:100vh;background:var(--ground,#0f1115);color:var(--text-primary,#e8eaed);font-family:system-ui,sans-serif;padding:20px;text-align:center;">
          <div style="max-width:400px;">
            <div style="width:48px;height:48px;border:4px solid var(--border-default,#2a2e38);border-top-color:var(--accent-brand,#ff7043);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 24px;"></div>
            <h2 style="margin:0 0 12px;font-size:18px;font-weight:600;">Loading Quant Vision…</h2>
            <p style="margin:0;color:var(--text-secondary,#9ca3af);font-size:14px;">Initializing app…</p>
            <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
          </div>
        </div>
      </div>
      <noscript>
                    <div style="display:flex;align-items:center;justify-content:center;min-height:100vh;background:#0f1115;color:#e8eaed;font-family:system-ui,sans-serif;padding:20px;text-align:center;">
                      <div style="max-width:400px;">
                        <h2 style="color:#ef5350;margin-bottom:12px;">JavaScript Required</h2>
                        <p>This application requires JavaScript to run. Please enable JavaScript in your browser settings.</p>
                      </div>
                    </div>
                  </noscript>
                  <div id="js-error" style="display:none;position:fixed;top:0;left:0;right:0;background:#ef5350;color:#fff;padding:16px;z-index:9999;font-family:monospace;font-size:12px;max-height:50vh;overflow:auto;"></div>
                  <div id="js-status" style="position:fixed;bottom:16px;right:16px;background:#333;color:#fff;padding:8px 12px;border-radius:4px;font-family:monospace;font-size:11px;z-index:9998;">JS: loading…</div>
                  <script>
                    window.addEventListener('error', function(e) {
                      var el = document.getElementById('js-error');
                      el.style.display = 'block';
                      el.textContent += 'Error: ' + e.message + '\n' + (e.error?.stack || '') + '\n\n';
                    });
                    window.addEventListener('unhandledrejection', function(e) {
                      var el = document.getElementById('js-error');
                      el.style.display = 'block';
                      el.textContent += 'Unhandled Promise Rejection: ' + e.reason + '\n\n';
                    });
                    // Update status when module loads
                    document.currentScript.onload = function() {
                      var el = document.getElementById('js-status');
                      el.textContent = 'JS: module loaded';
                      el.style.background = '#22c55e';
                    };
                    document.currentScript.onerror = function() {
                      var el = document.getElementById('js-status');
                      el.textContent = 'JS: module FAILED';
                      el.style.background = '#ef5350';
                    };
                  </script>
                  <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
